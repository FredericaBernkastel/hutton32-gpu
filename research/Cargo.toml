[package]
name = "ca-research"
version = "0.1.0"
edition = "2021"
description = "Measurement harness for paper.md (hash-consed tile CA on GPU)"

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"

[profile.release]
opt-level = 3
debug = false
